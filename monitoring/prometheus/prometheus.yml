global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI: HTTP metrics + application metrics (metrics.py)
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # PostgreSQL via postgres-exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Silo (MinIO-compatible) cluster metrics; MINIO_PROMETHEUS_AUTH_TYPE=public in compose.yaml
  - job_name: silo
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["silo:9000"]
