# Unit tests for alerts.yml: promtool test rules alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # 30 failed logins in 15 minutes -> alert
      - series: 'pcs_login_attempts_total{job="api", instance="api:8000", result="failure"}'
        values: "0+2x20"
      - series: 'pcs_user_used_bytes{job="api", instance="api:8000", username="ayah"}'
        values: "950x10"
      - series: 'pcs_user_quota_bytes{job="api", instance="api:8000", username="ayah"}'
        values: "1000x10"
      - series: 'pcs_user_used_bytes{job="api", instance="api:8000", username="ibu"}'
        values: "100x10"
      - series: 'pcs_user_quota_bytes{job="api", instance="api:8000", username="ibu"}'
        values: "1000x10"
    alert_rule_test:
      - eval_time: 16m
        alertname: LoginFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              instance: api:8000
              result: failure
            exp_annotations:
              summary: "More than 20 failed logins in 15 minutes"
              description: "Possible password guessing. Check Nginx access logs for the source address."
      - eval_time: 6m
        alertname: UserQuotaAlmostFull
        exp_alerts:
          - exp_labels:
              severity: info
              job: api
              instance: api:8000
              username: ayah
            exp_annotations:
              summary: "ayah has used more than 90% of their quota"

  - interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:8000"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api
              instance: api:8000
            exp_annotations:
              summary: "api is down"
              description: "Prometheus has not been able to scrape api:8000 for 2 minutes."
