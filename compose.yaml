x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://silo:9000
  S3_PUBLIC_ENDPOINT: https://localhost
  S3_ACCESS_KEY: ${SILO_ROOT_USER}
  S3_SECRET_KEY: ${SILO_ROOT_PASSWORD}
  S3_BUCKET: cloud-storage
  JWT_SECRET: ${JWT_SECRET}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    volumes:
      - silodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  init:
    build: .
    image: personal-cloud-storage:latest
    command: ["sh", "-c", "alembic upgrade head && python init_storage.py"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: personal-cloud-storage:latest
    environment: *app-env
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      api:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  silodata:
