name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests (SQLite)
        run: pytest -v

      - name: Unit tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: pytest -v

      - name: Prometheus config & alert rule tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.4 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.4 test rules alerts.test.yml

  smoke:
    name: Smoke test full stack
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Generate throwaway .env
        run: |
          {
            echo "POSTGRES_USER=cloud_app"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=cloud_storage"
            echo "SILO_ROOT_USER=silo-root"
            echo "SILO_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Generate self-signed certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout nginx/certs/localhost.key \
            -out nginx/certs/localhost.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Start stack
        run: docker compose up -d --build

      - name: Migrations roundtrip & drift check
        run: |
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check

      - name: End-to-end smoke test
        run: bash scripts/smoke_test.sh

      - name: Monitoring check
        run: bash scripts/monitoring_check.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
